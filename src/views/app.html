<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/brutal.css">
  <title>NANO — DASHBOARD</title>
</head>
<body>
  <div class="brut-shell">

    <div class="brut-nav">
      <a href="/app" class="brut-nav-item active">Dashboard</a>
      <a href="/teams" class="brut-nav-item">Équipes</a>
      <a href="/settings" class="brut-nav-item">Paramètres</a>
      <span class="brut-nav-spacer"></span>
      <span class="brut-nav-item" id="user-label" style="cursor:default;"></span>
      <button type="button" id="logout-btn" class="brut-nav-item">Déconnexion</button>
    </div>

    <div class="brut-window wide" style="width:100%;">
      <h1 class="brut-logo" style="font-size: clamp(1.8rem, 5vw, 3rem);">DEPLOY.</h1>

      <div class="brut-block yellow" style="margin-bottom: 24px;">
        <h2 class="brut-h" style="margin-bottom:14px;">Nouveau déploiement</h2>
        <form id="deploy-form">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="brut-field" style="margin-bottom:10px;">
              <label for="deploy-name">Nom du site</label>
              <input type="text" id="deploy-name" name="name" class="brut-input" placeholder="mon-site" required>
            </div>
            <div class="brut-field" style="margin-bottom:10px;">
              <label>Fichier .zip</label>
              <div style="display:flex; gap:8px; align-items:center;">
                <button type="button" id="browse-btn" class="brut-btn secondary small">Choisir</button>
                <span id="file-label" style="font-size:12.5px; font-weight:700;">aucun fichier</span>
                <input type="file" id="deploy-file" name="build" accept=".zip" required class="hidden">
              </div>
            </div>
          </div>
          <div id="drop-zone" style="border:3px dashed var(--ink); padding:10px 14px; margin: 6px 0 14px; font-size:12.5px; font-weight:700; text-align:center;">
            OU GLISSE-DÉPOSE UN .ZIP ICI
          </div>
          <button type="submit" id="deploy-submit" class="brut-btn">Déployer maintenant →</button>
        </form>
        <p id="deploy-status" class="brut-status"></p>
      </div>

      <hr class="brut-rule">

      <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <h2 class="brut-h" id="deployments-heading" style="margin:0;">Déploiements</h2>
        <button type="button" id="refresh-btn" class="brut-btn secondary small">↻ Rafraîchir</button>
      </div>

      <div id="deployments-list"></div>

      <hr class="brut-rule">

      <div style="display:grid; grid-template-columns: 1.3fr 1fr; gap: 24px;" id="bottom-grid">
        <div class="brut-block tight">
          <h2 class="brut-h" style="font-size:1rem;">Activité récente</h2>
          <div id="activity-log" style="font-size:13px; font-weight:700;"></div>
          <circle cx="70" cy="72" r="2.6" fill="#22d3ee" class="pulse-dot" style="animation-delay:0s"/>
          <circle cx="135" cy="88" r="2.6" fill="#8b5cf6" class="pulse-dot" style="animation-delay:.4s"/>
          <circle cx="105" cy="130" r="2.6" fill="#ec4899" class="pulse-dot" style="animation-delay:.8s"/>
          <circle cx="60" cy="120" r="2.6" fill="#22d3ee" class="pulse-dot" style="animation-delay:1.2s"/>
          <circle cx="140" cy="130" r="2.6" fill="#8b5cf6" class="pulse-dot" style="animation-delay:1.6s"/>
        </svg>
        <p class="text-xs text-gray-500 text-center mt-1">Répartition indicative des requêtes par région</p>
      </section>

      <!-- Statistiques rapides -->
      <section class="card rounded-2xl p-5">
        <h2 class="text-sm font-semibold mb-3">Statistiques Rapides</h2>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p id="stat-deployments" class="text-2xl font-bold">0</p>
            <p class="text-xs text-gray-500">Déploiements actifs</p>
          </div>
          <div>
            <p id="stat-requests" class="text-2xl font-bold">0</p>
            <p class="text-xs text-gray-500">Requêtes (24h)</p>
          </div>
          <div>
            <p id="stat-uptime" class="text-2xl font-bold">99.8%</p>
            <p class="text-xs text-gray-500">Disponibilité</p>
          </div>
          <div>
            <p id="stat-bandwidth" class="text-2xl font-bold">0 Go</p>
            <p class="text-xs text-gray-500">Bande passante</p>
          </div>
        </div>
      </section>

    </div>
  </main>

  <script>
    const token = localStorage.getItem("billet");

    function authHeaders() {
      return { "Authorization": `Bearer ${token}` };
    }

    function decodeUsername() {
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        return payload.username || "?";
      } catch {
        return "?";
      }
    }

    async function checkAuth() {
      if (!token) {
        window.location.href = "/login";
        return false;
      }
      const res = await fetch("/auth", { headers: authHeaders() });
      if (!res.ok) {
        localStorage.removeItem("billet");
        window.location.href = "/login";
        return false;
      }
      document.getElementById("avatar-inner").textContent = decodeUsername().slice(0, 1).toUpperCase();
      return true;
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("billet");
      window.location.href = "/login";
    });

    // Nombre déterministe par nom, pour des métriques de démo stables (pas de vraies analytics côté backend)
    function seededValue(seed, min, max) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
      return min + (hash % (max - min));
    }

    function sparklinePoints(seed) {
      const points = [];
      for (let i = 0; i < 12; i++) {
        points.push(seededValue(seed + i, 8, 32));
      }
      const max = Math.max(...points);
      return points.map((v, i) => `${i * (100 / 11)},${32 - (v / max) * 28}`).join(" ");
    }

    function relativeTime(value) {
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      const diffMs = Date.now() - date.getTime();
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 1) return "à l'instant";
      if (diffMin < 60) return `il y a ${diffMin}m`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `il y a ${diffH}h`;
      const diffD = Math.round(diffH / 24);
      if (diffD < 30) return `il y a ${diffD}j`;
      const diffMonth = Math.round(diffD / 30);
      if (diffMonth < 12) return `il y a ${diffMonth} mois`;
      return `il y a ${Math.round(diffMonth / 12)} an(s)`;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString("fr-FR", { year: "numeric", month: "short", day: "numeric" });
    }

    function statusBadge(status) {
      const active = status === "active";
      return `<span class="text-xs px-2 py-0.5 rounded-full ${active ? "bg-green-500/10 text-green-400" : "bg-gray-500/10 text-gray-400"}">${status}</span>`;
    }

    function deploymentRow(dep) {
      const health = (99 + seededValue(dep.id, 0, 10) / 10).toFixed(1);
      const traffic = seededValue(dep.id + "t", 2, 40);
      const points = sparklinePoints(dep.id);

      return `
        <tr class="border-b border-[#1a1a1a] last:border-0">
          <td class="py-3 pr-4 align-top">
            <div class="flex items-center gap-2">
              <span class="font-medium">${dep.name}</span>
              ${statusBadge(dep.status)}
            </div>
            <a href="${dep.url}" target="_blank" class="text-xs text-blue-400 hover:underline break-all">${dep.url}</a>
            <p class="text-xs text-gray-500 mt-0.5">Créé le ${formatDate(dep.createdAt)}</p>
          </td>
          <td class="py-3 pr-4 align-top text-xs text-gray-400">
            <p class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-green-400"></span> Santé: ${health}% OK</p>
            <p class="mt-1">Dernière mise à jour: ${relativeTime(dep.createdAt)}</p>
          </td>
          <td class="py-3 pr-4 align-top">
            <svg viewBox="0 0 100 32" class="w-24 h-8">
              <polyline points="${points}" fill="none" stroke="#3b82f6" stroke-width="2" class="sparkline-path"/>
            </svg>
            <p class="text-xs text-gray-500 mt-0.5">${traffic}k reqs</p>
          </td>
          <td class="py-3 align-top text-right whitespace-nowrap">
            <a href="${dep.url}" target="_blank" class="text-xs px-3 py-1.5 rounded-lg border border-[#2e2e2e] hover:border-gray-500 transition-colors inline-block">Ouvrir</a>
            <button data-id="${dep.id}" class="delete-btn text-xs px-3 py-1.5 rounded-lg border border-red-900/60 text-red-400 hover:bg-red-900/20 transition-colors ml-2">Supprimer</button>
          </td>
        </tr>
      `;
    }

    function activityItem(dep) {
      return `
        <li class="flex items-start gap-2">
          <span class="w-1.5 h-1.5 rounded-full bg-green-400 mt-1.5 shrink-0"></span>
          <div class="min-w-0 flex-1">
            <p class="font-medium truncate">${dep.name}</p>
            <p class="text-xs text-gray-500">Créé le ${formatDate(dep.createdAt)}</p>
          </div>
          <span class="text-xs text-gray-500 shrink-0">${relativeTime(dep.createdAt)}</span>
        </li>
      `;
    }

    async function loadDeployments() {
      const bodyEl = document.getElementById("deployments-body");
      const activityEl = document.getElementById("activity-list");

      try {
        const res = await fetch("/api/deployments", { headers: authHeaders() });
        const deployments = await res.json();

        if (!Array.isArray(deployments) || deployments.length === 0) {
          bodyEl.innerHTML = `<tr><td colspan="4" class="py-6 text-gray-500 text-sm">Aucun déploiement pour le moment.</td></tr>`;
          activityEl.innerHTML = `<li class="text-gray-500 text-sm">Aucune activité.</li>`;
          document.getElementById("stat-deployments").textContent = "0";
          document.getElementById("stat-requests").textContent = "0";
          document.getElementById("stat-bandwidth").textContent = "0 Go";
          return;
        }

        bodyEl.innerHTML = deployments.map(deploymentRow).join("");

        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", () => deleteDeployment(btn.dataset.id));
        });

        const sorted = [...deployments].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        activityEl.innerHTML = sorted.slice(0, 4).map(activityItem).join("");

        const totalTraffic = deployments.reduce((sum, d) => sum + seededValue(d.id + "t", 2, 40), 0);
        document.getElementById("stat-deployments").textContent = deployments.length;
        document.getElementById("stat-requests").textContent = `${totalTraffic}k`;
        document.getElementById("stat-bandwidth").textContent = `${(totalTraffic * 0.03).toFixed(1)} Go`;
      } catch (err) {
        bodyEl.innerHTML = `<tr><td colspan="4" class="py-6 text-red-400 text-sm">Erreur lors du chargement des déploiements.</td></tr>`;
      }
    }

    async function deleteDeployment(id) {
      if (!confirm("Supprimer ce déploiement ?")) return;

      const res = await fetch(`/api/deployments/${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: authHeaders(),
      });

      if (res.ok || res.status === 204) {
        loadDeployments();
      } else {
        alert("Impossible de supprimer ce déploiement.");
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", loadDeployments);

    const fileInput = document.getElementById("deploy-file");
    const fileLabel = document.getElementById("file-label");
    const dropZone = document.getElementById("drop-zone");

    document.getElementById("browse-btn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      fileLabel.textContent = fileInput.files[0]?.name || "Glisser-déposer un fichier .zip";
    });

    ["dragover", "dragenter"].forEach((evt) => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.add("border-blue-500");
      });
    });
    ["dragleave", "drop"].forEach((evt) => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.classList.remove("border-blue-500");
      });
    });
    dropZone.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        fileLabel.textContent = file.name;
      }
    });

    const deployForm = document.getElementById("deploy-form");
    const deployError = document.getElementById("deploy-error");
    const deploySubmit = document.getElementById("deploy-submit");

    deployForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      deployError.classList.add("hidden");
      deploySubmit.disabled = true;
      deploySubmit.textContent = "Déploiement...";

      const formData = new FormData();
      formData.append("name", document.getElementById("deploy-name").value);
      formData.append("build", fileInput.files[0]);

      try {
        const res = await fetch("/api/deployments", {
          method: "POST",
          headers: authHeaders(),
          body: formData,
        });

        if (res.ok) {
          deployForm.reset();
          fileLabel.textContent = "Glisser-déposer un fichier .zip";
          loadDeployments();
        } else {
          const err = await res.json().catch(() => ({}));
          const apiError = typeof err.error === "string" ? err.error : err.error?.message;
          deployError.textContent = apiError || err.message || "Échec du déploiement.";
          deployError.classList.remove("hidden");
        }
      } catch (err) {
        deployError.textContent = "Erreur réseau, réessaie.";
        deployError.classList.remove("hidden");
      } finally {
        deploySubmit.disabled = false;
        deploySubmit.textContent = "Déployer";
      }
    });

    (async () => {
      const ok = await checkAuth();
      if (ok) loadDeployments();
    })();
  </script>
</body>
</html>
