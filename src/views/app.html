<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/brutal.css">
  <title>NANO — DASHBOARD</title>
</head>
<body>
  <div class="brut-shell">

    <div class="brut-nav">
      <a href="/app" class="brut-nav-item active">Dashboard</a>
      <a href="/teams" class="brut-nav-item">Équipes</a>
      <a href="/settings" class="brut-nav-item">Paramètres</a>
      <span class="brut-nav-spacer"></span>
      <span class="brut-nav-item" id="user-label" style="cursor:default;"></span>
      <button type="button" id="logout-btn" class="brut-nav-item">Déconnexion</button>
    </div>

    <div class="brut-window wide" style="width:100%;">
      <h1 class="brut-logo" style="font-size: clamp(1.8rem, 5vw, 3rem);">DEPLOY.</h1>

      <div class="brut-block yellow" style="margin-bottom: 24px;">
        <h2 class="brut-h" style="margin-bottom:14px;">Nouveau déploiement</h2>
        <form id="deploy-form">
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="brut-field" style="margin-bottom:10px;">
              <label for="deploy-name">Nom du site</label>
              <input type="text" id="deploy-name" name="name" class="brut-input" placeholder="mon-site" required>
            </div>
            <div class="brut-field" style="margin-bottom:10px;">
              <label>Fichier .zip</label>
              <div style="display:flex; gap:8px; align-items:center;">
                <button type="button" id="browse-btn" class="brut-btn secondary small">Choisir</button>
                <span id="file-label" style="font-size:12.5px; font-weight:400;">aucun fichier</span>
                <input type="file" id="deploy-file" name="build" accept=".zip" required class="hidden">
              </div>
            </div>
          </div>
          <div id="drop-zone" style="border:2px dashed var(--ink); padding:10px 14px; margin: 6px 0 14px; font-size:12.5px; font-weight:400; text-align:center;">
            OU GLISSE-DÉPOSE UN .ZIP ICI
          </div>
          <p class="brut-meta" style="margin: -6px 0 14px;">
            Types de fichiers acceptés : .zip · choisis ou dépose un fichier pour déployer
          </p>
          <button type="submit" id="deploy-submit" class="brut-btn">Déployer maintenant →</button>
        </form>
        <p id="deploy-status" class="brut-status"></p>
      </div>

      <hr class="brut-rule">

      <div style="display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <h2 class="brut-h" id="deployments-heading" style="margin:0;">Déploiements</h2>
        <button type="button" id="refresh-btn" class="brut-btn secondary small">↻ Rafraîchir</button>
      </div>

      <div id="deployments-list"></div>

      <hr class="brut-rule">

      <div style="display:grid; grid-template-columns: 1.3fr 1fr; gap: 24px;" id="bottom-grid">
        <div class="brut-block tight">
          <h2 class="brut-h" style="font-size:1rem;">Activité récente</h2>
          <div id="activity-log" style="font-size:13px; font-weight:400;"></div>
        </div>
        <div class="brut-block ink tight">
          <h2 class="brut-h" style="font-size:1rem; color:var(--yellow);">Stats</h2>
          <div class="brut-stats-grid" id="stats-grid" style="margin-top:0;"></div>
        </div>
      </div>
    </div>

    <p style="margin-top: 24px; font-size: 12px; text-align:center;">© NANO — deploy or die</p>
  </div>

  <script>
    const token = localStorage.getItem("billet");

    function authHeaders() {
      return { "Authorization": `Bearer ${token}` };
    }

    function decodeUsername() {
      try {
        return JSON.parse(atob(token.split(".")[1])).username || "?";
      } catch {
        return "?";
      }
    }

    async function checkAuth() {
      if (!token) {
        window.location.href = "/login";
        return false;
      }
      const res = await fetch("/auth", { headers: authHeaders() });
      if (!res.ok) {
        localStorage.removeItem("billet");
        window.location.href = "/login";
        return false;
      }
      document.getElementById("user-label").textContent = decodeUsername().toUpperCase();
      return true;
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("billet");
      window.location.href = "/login";
    });

    function seededValue(seed, min, max) {
      let hash = 0;
      for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
      return min + (hash % (max - min));
    }

    const BLOCKS = ["▁", "▂", "▃", "▄", "▅", "▆", "▇", "█"];
    function sparkline(seed, len) {
      len = len || 10;
      let s = "";
      for (let i = 0; i < len; i++) s += BLOCKS[seededValue(seed + i, 0, BLOCKS.length)];
      return s;
    }

    function relativeTime(value) {
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      const diffMs = Date.now() - date.getTime();
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 1) return "à l'instant";
      if (diffMin < 60) return `il y a ${diffMin}m`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `il y a ${diffH}h`;
      const diffD = Math.round(diffH / 24);
      if (diffD < 30) return `il y a ${diffD}j`;
      const diffMonth = Math.round(diffD / 30);
      if (diffMonth < 12) return `il y a ${diffMonth} mois`;
      return `il y a ${Math.round(diffMonth / 12)} an(s)`;
    }

    function formatDate(value) {
      const date = new Date(value);
      if (isNaN(date.getTime())) return String(value);
      return date.toLocaleDateString("fr-FR", { year: "numeric", month: "short", day: "numeric" });
    }

    function deploymentTicket(dep) {
      const health = (99 + seededValue(dep.id, 0, 10) / 10).toFixed(1);
      const traffic = seededValue(dep.id + "t", 2, 40);

      return `
        <div class="brut-ticket">
          <div>
            <p class="brut-ticket-name">${dep.name}<span class="brut-badge ${dep.status}">${dep.status}</span><span class="brut-dot ${dep.status}"></span></p>
            <p class="brut-meta"><a href="${dep.url}" target="_blank">${dep.url}</a></p>
            <p class="brut-meta">créé le ${formatDate(dep.createdAt)} · santé ${health}% · maj ${relativeTime(dep.createdAt)}</p>
            <p class="brut-spark">${sparkline(dep.id)} <span class="brut-meta">${traffic}k reqs/24h</span></p>
          </div>
          <div class="brut-actions" id="actions-${cssEscape(dep.id)}">
            <a href="${dep.url}" target="_blank" class="brut-btn secondary small">Ouvrir</a>
            <button data-id="${dep.id}" class="delete-btn brut-btn danger small">Supprimer</button>
          </div>
        </div>
      `;
    }

    function cssEscape(id) {
      return String(id).replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    async function loadDeployments() {
      const listEl = document.getElementById("deployments-list");
      const headingEl = document.getElementById("deployments-heading");
      const activityEl = document.getElementById("activity-log");
      const statsEl = document.getElementById("stats-grid");

      try {
        const res = await fetch("/api/deployments", { headers: authHeaders() });
        const deployments = await res.json();

        headingEl.textContent = `Déploiements (${deployments.length})`;

        if (!Array.isArray(deployments) || deployments.length === 0) {
          listEl.innerHTML = `<div class="brut-block tight"><strong>AUCUN DÉPLOIEMENT.</strong> Balance ton premier .zip ci-dessus.</div>`;
          activityEl.innerHTML = `<p>-- rien à signaler --</p>`;
          statsEl.innerHTML = `<div class="brut-stat"><span class="num">0</span><span class="label">sites</span></div>`;
          return;
        }

        listEl.innerHTML = deployments.map(deploymentTicket).join("");

        document.querySelectorAll(".delete-btn").forEach((btn) => {
          btn.addEventListener("click", () => askDeleteConfirmation(btn.dataset.id));
        });

        const sorted = [...deployments].sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
        activityEl.innerHTML = sorted.slice(0, 5).map((d) =>
          `<p style="margin:4px 0;">▸ ${d.name} — ${relativeTime(d.createdAt)}</p>`
        ).join("");

        const totalTraffic = deployments.reduce((sum, d) => sum + seededValue(d.id + "t", 2, 40), 0);
        statsEl.innerHTML = `
          <div class="brut-stat" style="background:var(--ink); border-color:var(--yellow); color:var(--white);"><span class="num" style="color:var(--yellow);">${deployments.length}</span><span class="label">sites</span></div>
          <div class="brut-stat" style="background:var(--ink); border-color:var(--yellow); color:var(--white);"><span class="num" style="color:var(--yellow);">${totalTraffic}k</span><span class="label">reqs/24h</span></div>
          <div class="brut-stat" style="background:var(--ink); border-color:var(--yellow); color:var(--white);"><span class="num" style="color:var(--yellow);">99.8%</span><span class="label">uptime</span></div>
          <div class="brut-stat" style="background:var(--ink); border-color:var(--yellow); color:var(--white);"><span class="num" style="color:var(--yellow);">${(totalTraffic * 0.03).toFixed(1)}</span><span class="label">Go bande passante</span></div>
        `;
      } catch (err) {
        listEl.innerHTML = `<div class="brut-status err" style="display:block;">ERREUR DE CHARGEMENT</div>`;
      }
    }

    function askDeleteConfirmation(id) {
      const actionsEl = document.getElementById(`actions-${cssEscape(id)}`);
      if (!actionsEl) return;
      const original = actionsEl.innerHTML;

      actionsEl.innerHTML = `
        <div class="brut-confirm">
          <p>Supprimer "${id}" ?<br>C'est définitif.</p>
          <div class="brut-confirm-actions">
            <button type="button" class="brut-btn danger small confirm-yes">Confirmer</button>
            <button type="button" class="brut-btn secondary small confirm-no">Annuler</button>
          </div>
        </div>
      `;

      actionsEl.querySelector(".confirm-no").addEventListener("click", () => {
        actionsEl.innerHTML = original;
        actionsEl.querySelector(".delete-btn").addEventListener("click", () => askDeleteConfirmation(id));
      });
      actionsEl.querySelector(".confirm-yes").addEventListener("click", () => deleteDeployment(id));
    }

    async function deleteDeployment(id) {
      const res = await fetch(`/api/deployments/${encodeURIComponent(id)}`, {
        method: "DELETE",
        headers: authHeaders(),
      });

      if (res.ok || res.status === 204) {
        loadDeployments();
      } else {
        alert("Impossible de supprimer ce déploiement.");
      }
    }

    document.getElementById("refresh-btn").addEventListener("click", loadDeployments);

    const fileInput = document.getElementById("deploy-file");
    const fileLabel = document.getElementById("file-label");
    const dropZone = document.getElementById("drop-zone");

    document.getElementById("browse-btn").addEventListener("click", () => fileInput.click());
    fileInput.addEventListener("change", () => {
      fileLabel.textContent = fileInput.files[0]?.name || "aucun fichier";
    });

    ["dragover", "dragenter"].forEach((evt) => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.style.background = "var(--yellow)";
      });
    });
    ["dragleave", "drop"].forEach((evt) => {
      dropZone.addEventListener(evt, (e) => {
        e.preventDefault();
        dropZone.style.background = "transparent";
      });
    });
    dropZone.addEventListener("drop", (e) => {
      const file = e.dataTransfer.files[0];
      if (file) {
        fileInput.files = e.dataTransfer.files;
        fileLabel.textContent = file.name;
      }
    });

    const deployForm = document.getElementById("deploy-form");
    const deployStatus = document.getElementById("deploy-status");
    const deploySubmit = document.getElementById("deploy-submit");

    function setDeployStatus(text, kind) {
      deployStatus.textContent = text || "";
      deployStatus.classList.remove("err", "ok");
      if (kind) deployStatus.classList.add(kind);
    }

    deployForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      setDeployStatus("");
      deploySubmit.disabled = true;
      deploySubmit.textContent = "Déploiement en cours…";

      const formData = new FormData();
      formData.append("name", document.getElementById("deploy-name").value);
      formData.append("build", fileInput.files[0]);

      try {
        const res = await fetch("/api/deployments", {
          method: "POST",
          headers: authHeaders(),
          body: formData,
        });

        if (res.ok) {
          deployForm.reset();
          fileLabel.textContent = "aucun fichier";
          setDeployStatus("DÉPLOIEMENT CRÉÉ.", "ok");
          loadDeployments();
        } else {
          const err = await res.json().catch(() => ({}));
          const apiError = typeof err.error === "string" ? err.error : err.error?.message;
          setDeployStatus(apiError || err.message || "Échec du déploiement.", "err");
        }
      } catch (err) {
        setDeployStatus("Erreur réseau, réessaie.", "err");
      } finally {
        deploySubmit.disabled = false;
        deploySubmit.textContent = "Déployer maintenant →";
      }
    });

    (async () => {
      const ok = await checkAuth();
      if (ok) loadDeployments();
    })();
  </script>
</body>
</html>
