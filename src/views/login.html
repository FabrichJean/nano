<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/brutal.css">
  <title>NANO — LOGIN</title>
</head>
<body>
  <div class="brut-shell">
    <h1 class="brut-logo">NANO</h1>
    <p class="brut-tag">★ deploy or die ★</p>

    <div class="brut-block brut-window">
      <h2 class="brut-h">Connexion</h2>

      <form id="login-form">
        <div class="brut-field">
          <label for="identifier">Identifiant / Email</label>
          <input type="text" id="identifier" name="identifier" class="brut-input" autocomplete="username" required autofocus>
        </div>
        <div class="brut-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" class="brut-input" autocomplete="current-password" required>
        </div>

        <button type="submit" id="submit-btn" class="brut-btn">Se connecter →</button>
      </form>

      <p id="status" class="brut-status"></p>
    </div>

    <p style="margin-top: 22px; font-weight: 400; text-transform: uppercase; font-size: 13px;">
      Pas de compte ? <a href="/register" style="text-decoration: underline;">Inscris-toi ici</a>
    </p>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("billet");
      if (!token) return;

      const res = await fetch("/auth", {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` },
      });

      if (res.ok) {
        window.location.href = "/app";
      } else {
        localStorage.removeItem("billet");
      }
    });

    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    function setStatus(text, kind) {
      statusEl.textContent = text || "";
      statusEl.classList.remove("err", "ok");
      if (kind) statusEl.classList.add(kind);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");
      submitBtn.disabled = true;

      const data = new FormData(form);
      const identifier = data.get("identifier");
      const password = data.get("password");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          localStorage.setItem("billet", body.token);
          window.location.href = "/app";
          return;
        }

        if (body.needsVerification) {
          window.location.href = `/verify-email?email=${encodeURIComponent(body.email || identifier)}`;
          return;
        }

        setStatus(body.error || "Identifiants incorrects.", "err");
      } catch (err) {
        setStatus("Erreur réseau, réessaie.", "err");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
