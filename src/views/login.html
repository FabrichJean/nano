<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/skills.css">
  <title>NANO — Connexion</title>
</head>
<body>
  <div class="sk-auth-shell">
    <div class="sk-auth-card">
      <div class="sk-auth-title">
        <div class="sk-glitch-wrap xsmall">
          <span class="sk-glitch-layer">NANO</span>
          <span class="sk-glitch-layer">NANO</span>
          <span class="sk-glitch-layer">NANO</span>
          <span class="sk-glitch-layer">NANO</span>
          <span class="sk-glitch-layer">NANO</span>
          <h1 class="sk-glitch">NANO</h1>
        </div>
        <p class="sk-tagline">deployment shell</p>
      </div>

      <div class="sk-panel">
        <p class="sk-h">Connexion</p>
        <form id="login-form">
          <div class="sk-field">
            <label for="identifier">Identifiant / Email</label>
            <input type="text" id="identifier" name="identifier" class="sk-input" autocomplete="username" required autofocus>
          </div>
          <div class="sk-field">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password" class="sk-input" autocomplete="current-password" required>
          </div>
          <button type="submit" id="submit-btn" class="sk-btn" style="width:100%; justify-content:center;">$ login →</button>
        </form>
        <p id="status" class="sk-status"></p>
      </div>

      <p style="text-align:center; color:var(--dim); font-size:13px;">
        Pas de compte ? <a href="/register" style="text-decoration:underline;">Inscris-toi</a>
      </p>
    </div>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("billet");
      if (!token) return;
      const res = await fetch("/auth", { headers: { "Authorization": `Bearer ${token}` } });
      if (res.ok) {
        window.location.href = "/app";
      } else {
        localStorage.removeItem("billet");
      }
    });

    const form = document.getElementById("login-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    function setStatus(text, kind) {
      statusEl.textContent = text || "";
      statusEl.classList.remove("err", "ok");
      if (kind) statusEl.classList.add(kind);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");
      submitBtn.disabled = true;

      const data = new FormData(form);
      const identifier = data.get("identifier");
      const password = data.get("password");

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier, password }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          localStorage.setItem("billet", body.token);
          window.location.href = "/app";
          return;
        }

        if (body.needsVerification) {
          window.location.href = `/verify-email?email=${encodeURIComponent(body.email || identifier)}`;
          return;
        }

        setStatus(body.error || "Identifiants incorrects.", "err");
      } catch (err) {
        setStatus("Erreur réseau, réessaie.", "err");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
