<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/brutal.css">
  <title>NANO — INSCRIPTION</title>
</head>
<body>
  <div class="ui-shell">
    <h1 class="ui-logo">NANO</h1>
    <p class="ui-tag">★ rejoins le club ★</p>

    <div class="ui-panel ui-window">
      <h2 class="ui-h">Créer un compte</h2>

      <form id="register-form">
        <div class="ui-field">
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" name="username" class="ui-input" minlength="3" autocomplete="username" required autofocus>
        </div>
        <div class="ui-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" class="ui-input" autocomplete="email" required>
        </div>
        <div class="ui-field">
          <label for="password">Mot de passe</label>
          <input type="password" id="password" name="password" class="ui-input" minlength="6" autocomplete="new-password" required>
        </div>
        <div class="ui-field">
          <label for="confirm-password">Confirmer</label>
          <input type="password" id="confirm-password" name="confirm-password" class="ui-input" minlength="6" autocomplete="new-password" required>
        </div>

        <button type="submit" id="submit-btn" class="ui-btn">Créer le compte →</button>
      </form>

      <p id="status" class="ui-status"></p>
    </div>

    <p style="margin-top: 22px; font-weight: 400; text-transform: uppercase; font-size: 13px;">
      Déjà membre ? <a href="/login" style="text-decoration: underline;">Connecte-toi</a>
    </p>
  </div>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("billet");
      if (!token) return;

      const res = await fetch("/auth", {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` },
      });

      if (res.ok) {
        window.location.href = "/app";
      } else {
        localStorage.removeItem("billet");
      }
    });

    const form = document.getElementById("register-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");

    function setStatus(text, kind) {
      statusEl.textContent = text || "";
      statusEl.classList.remove("err", "ok");
      if (kind) statusEl.classList.add(kind);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");

      const data = new FormData(form);
      const username = data.get("username");
      const email = data.get("email");
      const password = data.get("password");
      const confirmPassword = data.get("confirm-password");

      if (password !== confirmPassword) {
        setStatus("Les mots de passe ne correspondent pas.", "err");
        return;
      }

      submitBtn.disabled = true;

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          setStatus("Compte créé, vérifie ton email…", "ok");
          window.location.href = `/verify-email?email=${encodeURIComponent(body.email)}`;
          return;
        }

        setStatus(body.error || "Échec de l'inscription.", "err");
      } catch (err) {
        setStatus("Erreur réseau, réessaie.", "err");
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
