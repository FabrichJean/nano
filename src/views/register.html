<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Nano - Inscription</title>
</head>
<body class="bg-black min-h-screen flex flex-col items-center justify-center text-white">

  <div class="flex items-center gap-2 mb-8">
    <img src="/ghost.png" alt="Nano" class="w-9 h-9" />
    <span class="text-2xl font-bold tracking-tight">Nano</span>
  </div>

  <div class="bg-neutral-950 border border-neutral-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h1 class="text-xl font-semibold text-center mb-1">Créer un compte</h1>
    <p class="text-sm text-gray-400 text-center mb-6">Rejoins ton espace de déploiement</p>

    <form id="register-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-300 mb-1">Nom d'utilisateur</label>
        <input
          type="text"
          id="username"
          name="username"
          required
          minlength="3"
          autocomplete="username"
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          required
          autocomplete="email"
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="6"
          autocomplete="new-password"
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
        <p class="text-xs text-gray-500 mt-1">6 caractères minimum</p>
      </div>
      <div>
        <label for="confirm-password" class="block text-sm font-medium text-gray-300 mb-1">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirm-password"
          name="confirm-password"
          required
          minlength="6"
          autocomplete="new-password"
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 text-white rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
      </div>

      <p id="error" class="text-sm text-red-400 hidden"></p>

      <button
        type="submit"
        id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-500 transition-colors text-white font-semibold py-2.5 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900"
      >
        Créer mon compte
      </button>
    </form>

    <p class="text-sm text-gray-400 text-center mt-6">
      Déjà un compte ?
      <a href="/login" class="text-blue-500 hover:underline">Se connecter</a>
    </p>
  </div>

  <footer class="mt-8 text-gray-500 text-sm">
    Développé par
    <a href="https://github.com/fabrichgit" target="_blank" class="text-blue-500 hover:underline">
      Fabrich
    </a>
  </footer>

  <script>
    window.addEventListener("DOMContentLoaded", async () => {
      const token = localStorage.getItem("billet");
      if (!token) return;

      const res = await fetch("/auth", {
        method: "GET",
        headers: { "Authorization": `Bearer ${token}` },
      });

      if (res.ok) {
        window.location.href = "/app";
      } else {
        localStorage.removeItem("billet");
      }
    });

    const form = document.getElementById("register-form");
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.classList.add("hidden");

      const data = new FormData(form);
      const username = data.get("username");
      const email = data.get("email");
      const password = data.get("password");
      const confirmPassword = data.get("confirm-password");

      if (password !== confirmPassword) {
        errorEl.textContent = "Les mots de passe ne correspondent pas.";
        errorEl.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Création...";

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          window.location.href = `/verify-email?email=${encodeURIComponent(body.email)}`;
          return;
        }

        errorEl.textContent = body.error || "Échec de l'inscription.";
        errorEl.classList.remove("hidden");
      } catch (err) {
        errorEl.textContent = "Erreur réseau, réessaie.";
        errorEl.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Créer mon compte";
      }
    });
  </script>
</body>
</html>
