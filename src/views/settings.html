<!DOCTYPE html>
<html lang="fr">
<head>

</head>
<body>
  <div class="brut-shell">
    <div class="brut-nav">
      <a href="/app" class="brut-nav-item">Dashboard</a>
      <a href="/teams" class="brut-nav-item">Équipes</a>

      <span class="brut-nav-spacer"></span>
      <span class="brut-nav-item" id="user-label" style="cursor:default;"></span>
      <button type="button" id="logout-btn" class="brut-nav-item">Déconnexion</button>

          Équipes
        </a>
        <a href="/settings" class="tab-active flex items-center gap-2 px-3 py-1.5 rounded-lg text-sm font-medium">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Paramètres
        </a>
      </nav>

      <div class="flex items-center gap-3 shrink-0">
        <div class="grad-ring w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold p-[2px]">
          <span id="avatar-inner" class="w-full h-full rounded-full bg-[#0d0d0d] flex items-center justify-center">?</span>
        </div>
        <button id="logout-btn" class="text-sm text-gray-400 hover:text-white transition-colors">Se déconnecter</button>
      </div>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-6 py-20 text-center">
    <div class="card rounded-2xl p-12">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="mx-auto mb-4 text-gray-500"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <h1 class="text-xl font-semibold mb-2">Paramètres</h1>
      <p class="text-gray-400">Bientôt disponible. Les préférences de compte et de plateforme arrivent prochainement.</p>
    </div>
  </main>

  <script>
    const token = localStorage.getItem("billet");

    function decodeUsername() {
      try {
        const payload = JSON.parse(atob(token.split(".")[1]));
        return payload.username || "?";
      } catch {
        return "?";
      }
    }

    (async () => {
      if (!token) {
        window.location.href = "/login";
        return;
      }
      const res = await fetch("/auth", { headers: { "Authorization": `Bearer ${token}` } });
      if (!res.ok) {
        localStorage.removeItem("billet");
        window.location.href = "/login";
        return;
      }
      document.getElementById("avatar-inner").textContent = decodeUsername().slice(0, 1).toUpperCase();
    })();

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("billet");
      window.location.href = "/login";
    });
  </script>
</body>
</html>
