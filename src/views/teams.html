<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/skills.css">
  <title>NANO — Équipes</title>
</head>
<body>
  <div class="sk-nav">
    <div class="sk-nav-brand">
      <img src="/ghost.png" alt="" width="18" height="18" />
      <span class="sk-nav-crumb">/</span> Équipes
    </div>
    <div class="sk-nav-links">
      <a href="/app" class="sk-nav-link">Dashboard</a>
      <a href="/teams" class="sk-nav-link active">Équipes</a>
      <a href="/settings" class="sk-nav-link">Paramètres</a>
    </div>
    <span class="sk-nav-user" id="user-label"></span>
    <button type="button" id="logout-btn" class="sk-nav-btn">Déconnexion</button>
  </div>

  <div class="sk-page">
    <div class="sk-panel" style="text-align:center; padding:64px 28px;">
      <div class="sk-glitch-wrap small" style="margin-left:auto; margin-right:auto;">
        <span class="sk-glitch-layer">ÉQUIPES</span>
        <span class="sk-glitch-layer">ÉQUIPES</span>
        <span class="sk-glitch-layer">ÉQUIPES</span>
        <span class="sk-glitch-layer">ÉQUIPES</span>
        <span class="sk-glitch-layer">ÉQUIPES</span>
        <h1 class="sk-glitch">ÉQUIPES</h1>
      </div>
      <p style="color:var(--dim); margin-top:12px;">Bientôt disponible. Reviens plus tard.</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("billet");

    function decodeUsername() {
      try {
        return JSON.parse(atob(token.split(".")[1])).username || "?";
      } catch {
        return "?";
      }
    }

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("billet");
      window.location.href = "/login";
    });

    (async () => {
      if (!token) {
        window.location.href = "/login";
        return;
      }
      const res = await fetch("/auth", { headers: { "Authorization": `Bearer ${token}` } });
      if (!res.ok) {
        localStorage.removeItem("billet");
        window.location.href = "/login";
        return;
      }
      document.getElementById("user-label").textContent = decodeUsername();
    })();
  </script>
</body>
</html>
