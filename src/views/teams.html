<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/brutal.css">
  <title>NANO — ÉQUIPES</title>
</head>
<body>
  <div class="brut-shell">
    <div class="brut-nav">
      <a href="/app" class="brut-nav-item">Dashboard</a>
      <a href="/teams" class="brut-nav-item active">Équipes</a>
      <a href="/settings" class="brut-nav-item">Paramètres</a>
      <span class="brut-nav-spacer"></span>
      <span class="brut-nav-item" id="user-label" style="cursor:default;"></span>
      <button type="button" id="logout-btn" class="brut-nav-item">Déconnexion</button>
    </div>

    <div class="brut-block brut-window wide" style="text-align:center; width:100%;">
      <h1 class="brut-logo" style="font-size: clamp(2rem, 6vw, 3.5rem);">ÉQUIPES</h1>
      <p style="font-weight:700; text-transform:uppercase; margin-top:16px;">
        Bientôt disponible. Reviens plus tard.
      </p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem("billet");

    function decodeUsername() {
      try {
        return JSON.parse(atob(token.split(".")[1])).username || "?";
      } catch {
        return "?";
      }
    }

    (async () => {
      if (!token) {
        window.location.href = "/login";
        return;
      }
      const res = await fetch("/auth", { headers: { "Authorization": `Bearer ${token}` } });
      if (!res.ok) {
        localStorage.removeItem("billet");
        window.location.href = "/login";
        return;
      }
      document.getElementById("user-label").textContent = decodeUsername().toUpperCase();
    })();

    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("billet");
      window.location.href = "/login";
    });
  </script>
</body>
</html>
