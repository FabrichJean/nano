<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Nano - Vérification</title>
</head>
<body class="bg-black min-h-screen flex flex-col items-center justify-center text-white">

  <div class="flex items-center gap-2 mb-8">
    <img src="/ghost.png" alt="Nano" class="w-9 h-9" />
    <span class="text-2xl font-bold tracking-tight">Nano</span>
  </div>

  <div class="bg-neutral-950 border border-neutral-800 p-8 rounded-2xl shadow-xl w-full max-w-md">
    <h1 class="text-xl font-semibold text-center mb-1">Vérifie ton email</h1>
    <p id="subtitle" class="text-sm text-gray-400 text-center mb-6">
      Un code à 6 chiffres a été envoyé à ton adresse email.
    </p>

    <form id="verify-form" class="space-y-4">
      <input type="hidden" id="identifier" name="identifier">
      <div>
        <label for="code" class="block text-sm font-medium text-gray-300 mb-1">Code de vérification</label>
        <input
          type="text"
          id="code"
          name="code"
          required
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          placeholder="123456"
          autocomplete="one-time-code"
          class="w-full px-4 py-2.5 bg-neutral-900 border border-neutral-700 text-white text-center text-lg tracking-[0.5em] rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        >
      </div>

      <p id="error" class="text-sm text-red-400 hidden"></p>
      <p id="success" class="text-sm text-green-400 hidden"></p>

      <button
        type="submit"
        id="submit-btn"
        class="w-full bg-blue-600 hover:bg-blue-500 transition-colors text-white font-semibold py-2.5 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 focus:ring-offset-gray-900"
      >
        Vérifier
      </button>
    </form>

    <p class="text-sm text-gray-400 text-center mt-6">
      Pas reçu de code ?
      <button id="resend-btn" class="text-blue-500 hover:underline">Renvoyer le code</button>
    </p>
  </div>

  <footer class="mt-8 text-gray-500 text-sm">
    Développé par
    <a href="https://github.com/fabrichgit" target="_blank" class="text-blue-500 hover:underline">
      Fabrich
    </a>
  </footer>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email") || "";
    document.getElementById("identifier").value = email;
    if (email) {
      document.getElementById("subtitle").textContent = `Un code à 6 chiffres a été envoyé à ${email}.`;
    }

    const form = document.getElementById("verify-form");
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const submitBtn = document.getElementById("submit-btn");
    const resendBtn = document.getElementById("resend-btn");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.classList.add("hidden");
      successEl.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "Vérification...";

      const data = new FormData(form);

      try {
        const res = await fetch("/api/auth/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: data.get("identifier"), code: data.get("code") }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          localStorage.setItem("billet", body.token);
          window.location.href = "/app";
          return;
        }

        errorEl.textContent = body.error || "Code invalide ou expiré.";
        errorEl.classList.remove("hidden");
      } catch (err) {
        errorEl.textContent = "Erreur réseau, réessaie.";
        errorEl.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Vérifier";
      }
    });

    resendBtn.addEventListener("click", async () => {
      errorEl.classList.add("hidden");
      successEl.classList.add("hidden");
      resendBtn.disabled = true;
      resendBtn.textContent = "Envoi...";

      try {
        const res = await fetch("/api/auth/resend-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: document.getElementById("identifier").value }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          successEl.textContent = "Un nouveau code a été envoyé.";
          successEl.classList.remove("hidden");
        } else {
          errorEl.textContent = body.error || "Impossible de renvoyer le code.";
          errorEl.classList.remove("hidden");
        }
      } catch (err) {
        errorEl.textContent = "Erreur réseau, réessaie.";
        errorEl.classList.remove("hidden");
      } finally {
        resendBtn.disabled = false;
        resendBtn.textContent = "Renvoyer le code";
      }
    });
  </script>
</body>
</html>
