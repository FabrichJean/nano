<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/ghost.png" />
  <link rel="stylesheet" href="/brutal.css">
  <title>NANO — VÉRIFICATION</title>
</head>
<body>
  <div class="brut-shell">
    <h1 class="brut-logo">NANO</h1>
    <p class="brut-tag">★ prouve que t'es toi ★</p>

    <div class="brut-block brut-window">
      <h2 class="brut-h">Vérifie ton email</h2>
      <p id="subtitle" style="font-weight: 700; margin: -6px 0 18px;">
        Un code à 6 chiffres a été envoyé par email.
      </p>

      <form id="verify-form">
        <input type="hidden" id="identifier" name="identifier">
        <div class="brut-field">
          <label for="code">Code</label>
          <input
            type="text" id="code" name="code" class="brut-input code"
            inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
            placeholder="000000" autocomplete="one-time-code" required autofocus
          >
        </div>

        <button type="submit" id="submit-btn" class="brut-btn">Vérifier →</button>
        <button type="button" id="resend-btn" class="brut-btn secondary" style="margin-left: 10px;">Renvoyer</button>
      </form>

      <p id="status" class="brut-status"></p>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const email = params.get("email") || "";
    document.getElementById("identifier").value = email;
    if (email) {
      document.getElementById("subtitle").textContent = `Un code à 6 chiffres a été envoyé à ${email}.`;
    }

    const form = document.getElementById("verify-form");
    const statusEl = document.getElementById("status");
    const submitBtn = document.getElementById("submit-btn");
    const resendBtn = document.getElementById("resend-btn");

    function setStatus(text, kind) {
      statusEl.textContent = text || "";
      statusEl.classList.remove("err", "ok");
      if (kind) statusEl.classList.add(kind);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      setStatus("");
      submitBtn.disabled = true;

      const data = new FormData(form);

      try {
        const res = await fetch("/api/auth/verify-email", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: data.get("identifier"), code: data.get("code") }),
        });

        const body = await res.json().catch(() => ({}));

        if (res.ok) {
          localStorage.setItem("billet", body.token);
          setStatus("Email vérifié !", "ok");
          window.location.href = "/app";
          return;
        }

        setStatus(body.error || "Code invalide ou expiré.", "err");
      } catch (err) {
        setStatus("Erreur réseau, réessaie.", "err");
      } finally {
        submitBtn.disabled = false;
      }
    });

    resendBtn.addEventListener("click", async () => {
      setStatus("");
      resendBtn.disabled = true;

      try {
        const res = await fetch("/api/auth/resend-code", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ identifier: document.getElementById("identifier").value }),
        });

        const body = await res.json().catch(() => ({}));
        setStatus(body.message || body.error, res.ok ? "ok" : "err");
      } catch (err) {
        setStatus("Erreur réseau, réessaie.", "err");
      } finally {
        resendBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
